name: patch template metadata

on:
  push:
    branches:
      - fix/docwen-compat-templates-and-profile

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/docwen-compat-templates-and-profile
      - name: Consume DocWen template presentation metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/docwen/client.ts')
          text = path.read_text()
          old = '''export interface TemplateItem {
            id: string;
            name: string;
            target: string;
            description?: string;
          }
          '''
          new = '''export interface TemplateItem {
            id: string;
            name: string;
            target: string;
            description?: string;
            origin?: "builtin" | "custom";
            isDefault?: boolean;
          }
          '''
          if old not in text:
              raise SystemExit('TemplateItem anchor not found')
          text = text.replace(old, new, 1)
          old_map = '''      description: stringValue(item.description) || undefined,
            }));
          }
          
          async optimizations'''
          new_map = '''      description: stringValue(item.description) || undefined,
              origin: item.origin === "builtin" || item.origin === "custom" ? item.origin : undefined,
              isDefault: typeof item.is_default === "boolean" ? item.is_default : undefined,
            }));
          }
          
          async optimizations'''
          if old_map not in text:
              raise SystemExit('template mapping anchor not found')
          path.write_text(text.replace(old_map, new_map, 1))
          PY
          npx prettier --write src/docwen/client.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/docwen/client.ts
          git commit -m "feat: consume template origin and default metadata"
          git push origin HEAD:fix/docwen-compat-templates-and-profile
