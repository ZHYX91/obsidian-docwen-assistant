name: chatgpt-finish-assistant

on:
  push:
    branches: [fix/docwen-compat-templates-and-profile]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/docwen-compat-templates-and-profile
          fetch-depth: 0
      - name: Apply coordinated contract and UX fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/docwen/client.ts')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
          '''export interface TemplateItem {
            id: string;
            name: string;
            target: string;
            description?: string;
          }''',
          '''export interface TemplateItem {
            id: string;
            name: string;
            target: string;
            description?: string;
            origin: "builtin" | "custom";
            isDefault: boolean;
          }''', 1)
          s = s.replace(
          '''    return resources.map((item) => ({
                id: requiredStringValue(item.id, "template.id"),
                name: requiredStringValue(item.name, "template.name"),
                target: stringValue(item.target),
                description: stringValue(item.description) || undefined,
              }));''',
          '''    return resources.map((item) => ({
                id: requiredStringValue(item.id, "template.id"),
                name: requiredStringValue(item.name, "template.name"),
                target: stringValue(item.target),
                description: stringValue(item.description) || undefined,
                origin: requiredTemplateOrigin(item.origin),
                isDefault: item.is_default === true,
              }));''', 1)

          start = s.index('      try {\n        await rm(stagingRoot, { recursive: true, force: true });', s.index('private async withTaskStaging'))
          end_token = '      return result;'
          end = s.index(end_token, start) + len(end_token)
          s = s[:start] + '''      try {
                await rm(stagingRoot, { recursive: true, force: true });
              } catch (error) {
                // The business result is already authoritative. A post-publish
                // cleanup failure must not turn a successful task into a retry.
                console.warn("DocWen Assistant could not remove completed task staging.", error);
              }
              return result;''' + s[end:]

          start = s.index('function requireSingleDocx(bundle: ValidatedArtifactBundle): void {')
          end = s.index('\n}\n\n', start) + 2
          s = s[:start] + '''function requireSingleDocx(bundle: ValidatedArtifactBundle): void {
            const preferred = preferredArtifact(bundle);
            const entry = bundle.entries[0];
            if (
              bundle.entries.length !== 1
              || preferred.kind !== "document"
              || preferred.media_type !== DOCX_MEDIA_TYPE
              || !hasExactKeys(entry, ["artifact_id", "role", "ordinal", "preferred"])
              || entry.artifact_id !== preferred.artifact_id
              || entry.role !== "primary"
              || entry.ordinal !== 0
              || entry.preferred !== true
            ) {
              throw new LocalCliError("cli_integrity_error", "Resolved Markdown to DOCX requires one preferred DOCX document.");
            }
          }''' + s[end:]

          marker = 'function preferredSupportedOption('
          assert marker in s
          s = s.replace(marker, '''function requiredTemplateOrigin(value: unknown): "builtin" | "custom" {
            if (value === "builtin" || value === "custom") return value;
            throw invalidResponse("template.origin");
          }

          function preferredSupportedOption(''', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/actions/action-runner.ts')
          s = p.read_text(encoding='utf-8')
          assert '  "cli_integrity_error",\n  "cli_invalid_response",' in s
          s = s.replace('  "cli_integrity_error",\n  "cli_invalid_response",', '  "cli_incompatible_version",\n  "cli_integrity_error",\n  "cli_invalid_envelope",\n  "cli_invalid_response",', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/action-runner.test.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''    expect(state.notices[0]).toContain("版本不兼容");
              expect(state.notices[0]).not.toContain("A stable");
              expect(state.modals[0].contentEl.children[0].text).toContain("请更新 DocWen");''', '''    expect(state.notices).toHaveLength(0);
              expect(state.modals).toHaveLength(1);
              expect(state.modals[0].contentEl.children[0].text).toContain("版本不兼容");''', 1)
          s = s.replace('''    expect(state.notices).toHaveLength(1);
              expect(state.copied).toHaveLength(0);
              const button = state.modals[0].contentEl.children.at(-1);''', '''    expect(state.notices).toHaveLength(0);
              expect(state.modals).toHaveLength(1);
              expect(state.copied).toHaveLength(0);
              const button = state.modals[0].contentEl.children.at(-1);''', 1)
          s = s.replace('''    expect(state.notices).toHaveLength(1);
              expect(state.modals).toHaveLength(1);
            });

            it("turns missing configuration''', '''    expect(state.notices).toHaveLength(0);
              expect(state.modals).toHaveLength(1);
            });

            it("turns missing configuration''', 1)
          s = s.replace('''    expect(state.notices).toHaveLength(1);
              expect(state.modals).toHaveLength(1);
              expect(allText(state.modals[0].contentEl)).toContain("cli_invalid_envelope");''', '''    expect(state.notices).toHaveLength(0);
              expect(state.modals).toHaveLength(1);
              expect(allText(state.modals[0].contentEl)).toContain("cli_invalid_envelope");''', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/docwen/client.ts src/actions/action-runner.ts tests/action-runner.test.ts
          git diff --cached --check
          git commit -m "fix: finish clean bundle and error presentation contracts"
          git push origin HEAD:fix/docwen-compat-templates-and-profile
