name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          NPM_PACKAGE_MANAGER="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageManager = packageJson.packageManager;
          if (typeof packageManager !== "string" || !/^npm@\d+\.\d+\.\d+$/u.test(packageManager)) {
            throw new Error("package.json packageManager must use exact npm@x.y.z format");
          }
          process.stdout.write(packageManager);
          NODE
          )"
          npm install --global "$NPM_PACKAGE_MANAGER"
          test "$(npm --version)" = "${NPM_PACKAGE_MANAGER#npm@}"

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, type-check, build, and verify assets
        run: npm run check

      - name: Upload production plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-assistant-production
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error

  windows-owned-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          NPM_PACKAGE_MANAGER="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageManager = packageJson.packageManager;
          if (typeof packageManager !== "string" || !/^npm@\d+\.\d+\.\d+$/u.test(packageManager)) {
            throw new Error("package.json packageManager must use exact npm@x.y.z format");
          }
          process.stdout.write(packageManager);
          NODE
          )"
          npm install --global "$NPM_PACKAGE_MANAGER"
          test "$(npm --version)" = "${NPM_PACKAGE_MANAGER#npm@}"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Windows owner twice
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $first = Join-Path $env:RUNNER_TEMP "windows-owner-first"
          $second = Join-Path $env:RUNNER_TEMP "windows-owner-second"
          New-Item -ItemType Directory -Force -Path $first, $second | Out-Null
          node scripts/build-native-windows-owner.mjs $first
          node scripts/build-native-windows-owner.mjs $second
          if ((Get-FileHash (Join-Path $first "windows-x64.exe") -Algorithm SHA256).Hash -ne
              (Get-FileHash (Join-Path $second "windows-x64.exe") -Algorithm SHA256).Hash) {
            throw "Independent Windows owner builds differ."
          }
          if ((Get-FileHash (Join-Path $first "windows-machine-owner-x64.ts") -Algorithm SHA256).Hash -ne
              (Get-FileHash (Join-Path $second "windows-machine-owner-x64.ts") -Algorithm SHA256).Hash) {
            throw "Independent embedded owner modules differ."
          }
          Write-Output "--- WINDOWS-BUILD.json ---"
          Get-Content -Raw (Join-Path $first "WINDOWS-BUILD.json")
          Write-Output "--- windows-machine-owner-x64.ts ---"
          Get-Content -Raw (Join-Path $first "windows-machine-owner-x64.ts")
          Write-Output "--- end Windows owner rebuild ---"

      - name: Type-check Windows owner integration
        run: npm run typecheck

      - name: Exercise Windows Machine lifetime regressions
        run: npx vitest run tests/docwen-machine-windows-lifetime.test.ts
