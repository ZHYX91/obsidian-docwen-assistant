name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          NPM_PACKAGE_MANAGER="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageManager = packageJson.packageManager;
          if (typeof packageManager !== "string" || !/^npm@\d+\.\d+\.\d+$/u.test(packageManager)) {
            throw new Error("package.json packageManager must use exact npm@x.y.z format");
          }
          process.stdout.write(packageManager);
          NODE
          )"
          npm install --global "$NPM_PACKAGE_MANAGER"
          test "$(npm --version)" = "${NPM_PACKAGE_MANAGER#npm@}"

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, type-check, build, and verify assets
        run: npm run check

      - name: Upload production plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-assistant-production
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
