name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable x.y.z version to preflight before creating its tag
        required: true
        type: string
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  PUBLICATION_ARTIFACT_NAME: docwen-assistant-publication-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-release:
    name: Clean release build ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]

    steps:
      - name: Check out exact source into a clean runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          NPM_PACKAGE_MANAGER="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageManager = packageJson.packageManager;
          if (typeof packageManager !== "string" || !/^npm@\d+\.\d+\.\d+$/u.test(packageManager)) {
            throw new Error("package.json packageManager must use exact npm@x.y.z format");
          }
          process.stdout.write(packageManager);
          NODE
          )"
          npm install --global "$NPM_PACKAGE_MANAGER"
          test "$(npm --version)" = "${NPM_PACKAGE_MANAGER#npm@}"

      - name: Verify version and source identity
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          npm run release:version -- "$RELEASE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/verify-release-source.mjs preflight "$RELEASE_VERSION"
          else
            node scripts/verify-release-source.mjs release "$RELEASE_VERSION"
          fi

      - name: Install the exact lockfile and run the single full gate
        run: |
          npm ci
          npm run release:check

      - name: Build and strictly verify deterministic release assets
        run: |
          node scripts/package-release.mjs
          node scripts/verify-release-assets.mjs release "$RELEASE_VERSION"

      - name: Upload clean-build evidence for comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docwen-assistant-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: release/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  verify-release:
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.publication_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication_artifact.outputs.artifact-digest }}
      artifact_name: ${{ env.PUBLICATION_ARTIFACT_NAME }}
      handoff_sha256: ${{ steps.handoff.outputs.handoff_sha256 }}
      handoff_size: ${{ steps.handoff.outputs.handoff_size }}

    steps:
      - name: Check out exact source for read-only governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js for dependency-free governance scripts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Install exact npm for read-only verification
        shell: bash
        run: |
          set -euo pipefail
          NPM_PACKAGE_MANAGER="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageManager = packageJson.packageManager;
          if (typeof packageManager !== "string" || !/^npm@\d+\.\d+\.\d+$/u.test(packageManager)) {
            throw new Error("package.json packageManager must use exact npm@x.y.z format");
          }
          process.stdout.write(packageManager);
          NODE
          )"
          npm install --global "$NPM_PACKAGE_MANAGER"
          test "$(npm --version)" = "${NPM_PACKAGE_MANAGER#npm@}"

      - name: Run canonical release gates with read-only permissions
        run: |
          npm ci
          npm run release:check

      - name: Re-verify version and source identity
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          node scripts/check-release-version.mjs "$RELEASE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/verify-release-source.mjs preflight "$RELEASE_VERSION"
          else
            node scripts/verify-release-source.mjs release "$RELEASE_VERSION"
          fi

      - name: Download both exact current-attempt clean builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/a builds/b
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "docwen-assistant-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a" --dir builds/a
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "docwen-assistant-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-b" --dir builds/b

      - name: Verify independent clean builds byte for byte
        run: node scripts/verify-reproducible-release.mjs builds/a builds/b "$RELEASE_VERSION"

      - name: Verify canonical public immutable DocWen Core dependency
        id: docwen_core
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release-contract.mjs docwen-core

      - name: Resolve monotonic previous stable Release baseline
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release-contract.mjs baseline "$GITHUB_REPOSITORY" "$RELEASE_VERSION"

      - name: Verify previous stable Release is a source ancestor
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIOUS_RELEASE_TAG: ${{ steps.release_notes.outputs.start_tag }}
        run: node scripts/verify-release-source.mjs previous-ancestor "$RELEASE_VERSION" "$PREVIOUS_RELEASE_TAG"

      - name: Create exact deterministic publication handoff
        if: github.event_name == 'push'
        id: handoff
        env:
          DOCWEN_ASSET_DIGEST: ${{ steps.docwen_core.outputs.docwen_asset_digest }}
          DOCWEN_TAG: ${{ steps.docwen_core.outputs.docwen_tag }}
          DOCWEN_VERSION: ${{ steps.docwen_core.outputs.docwen_version }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIOUS_RELEASE_TAG: ${{ steps.release_notes.outputs.start_tag }}
        run: >-
          node scripts/package-publication-handoff.mjs
          builds/a
          publication/docwen-assistant-publication-handoff.zip

      - name: Upload the sole current-run publication artifact
        if: github.event_name == 'push'
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PUBLICATION_ARTIFACT_NAME }}
          path: publication/docwen-assistant-publication-handoff.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Record verified publication inputs
        shell: bash
        run: |
          {
            echo "### Verified publication inputs"
            echo "- Source: ${GITHUB_SHA}"
            echo "- Run/attempt: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo "- Previous stable Release: ${{ steps.release_notes.outputs.start_tag || '(initial exception)' }}"
            echo "- DocWen Core: ${{ steps.docwen_core.outputs.docwen_tag }}"
            echo "- Two clean builds: byte-identical"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight completed without publishing
        if: github.event_name == 'workflow_dispatch'
        run: echo "Release preflight passed for ${RELEASE_VERSION}; no tag or Release was created."

  publish:
    if: github.event_name == 'push'
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Materialize the fixed no-checkout publication boundary
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify-release.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify-release.outputs.artifact_digest }}
          EXPECTED_HANDOFF_SHA256: ${{ needs.verify-release.outputs.handoff_sha256 }}
          EXPECTED_HANDOFF_SIZE: ${{ needs.verify-release.outputs.handoff_size }}
          PUBLICATION_BOUNDARY_B64: 
          PUBLICATION_BOUNDARY_SHA256: bd42450dc0a592ad91a20b64a238992f66f8e663604275c4f6c3028b8e2bc9da
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')" = "3.12"
          boundary="$RUNNER_TEMP/docwen-publication-boundary.py"
          printf '%s' "$PUBLICATION_BOUNDARY_B64" | base64 --decode > "$boundary"
          printf '%s  %s\n' "$PUBLICATION_BOUNDARY_SHA256" "$boundary" | sha256sum --check --strict
          python3 "$boundary" handoff

      - name: Verify source, ancestry, assets, and same-tag state before mutation
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          HANDOFF_METADATA_PATH: ${{ steps.handoff.outputs.metadata_path }}
          RELEASE_DIR: ${{ steps.handoff.outputs.release_dir }}
        run: python3 "$RUNNER_TEMP/docwen-publication-boundary.py" before

      - name: Attest exact assets for a new Release
        if: steps.release_state.outputs.decision == 'create'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            ${{ steps.handoff.outputs.release_dir }}/main.js
            ${{ steps.handoff.outputs.release_dir }}/manifest.json
            ${{ steps.handoff.outputs.release_dir }}/styles.css
            ${{ steps.handoff.outputs.release_dir }}/docwen-assistant-${{ env.RELEASE_VERSION }}.zip

      - name: Re-verify source and previous Release immediately before creation
        if: steps.release_state.outputs.decision == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          HANDOFF_METADATA_PATH: ${{ steps.handoff.outputs.metadata_path }}
          RELEASE_DIR: ${{ steps.handoff.outputs.release_dir }}
        run: python3 "$RUNNER_TEMP/docwen-publication-boundary.py" source

      - name: Create the immutable GitHub Release without checkout
        if: steps.release_state.outputs.decision == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ steps.release_state.outputs.previous_release_tag }}
          RELEASE_DIR: ${{ steps.handoff.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "$RELEASE_DIR/main.js"
            "$RELEASE_DIR/manifest.json"
            "$RELEASE_DIR/styles.css"
            "$RELEASE_DIR/docwen-assistant-${RELEASE_VERSION}.zip"
          )
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            notes+=(--notes-start-tag "$PREVIOUS_RELEASE_TAG")
          fi
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            "${notes[@]}"

      - name: Final immutable Release and byte readback with finite retry
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          HANDOFF_METADATA_PATH: ${{ steps.handoff.outputs.metadata_path }}
          RELEASE_DIR: ${{ steps.handoff.outputs.release_dir }}
        run: python3 "$RUNNER_TEMP/docwen-publication-boundary.py" after

      - name: Verify exact signer, repository, tag, commit, and hosted provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.handoff.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "$RELEASE_DIR/docwen-assistant-${RELEASE_VERSION}.zip"
            "$RELEASE_DIR/main.js"
            "$RELEASE_DIR/manifest.json"
            "$RELEASE_DIR/styles.css"
          )
          for asset in "${assets[@]}"; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
